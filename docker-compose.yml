version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: registr
      POSTGRES_PASSWORD: registr
      POSTGRES_DB: registr
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  db_data:
