input {
  file {
    path => "/var/log/app/app.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
  file {
    path => "/var/log/app/notifications.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    add_field => { "log_type" => "notifications" }
  }
}

filter {

  if [log_type] == "notifications" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{GREEDYDATA:notification}" }
    }
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  } else {
    json {
      source => "message"
    }

    if "_jsonparsefailure" in [tags] {
      drop { }
    }

    if ![timestamp] and [ts] {
      mutate { rename => { "ts" => "timestamp" } }
    }

    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }
    }

    mutate { remove_field => ["message"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }

}
